name: Migrate Notes and Share Links to Ledgers (one-shot)

# 本番DBに対して「バックアップ → マイグレーション適用 →
# メモ・共有リンクのLedgerへの移行スクリプト」を実行するワンショットの手動ワークフロー。
# 定期実行はしない。
#
# 実行前に GitHub Secrets に以下が設定されていることを確認すること:
#   - DATABASE_URL: pgbouncer 経由 (6543番ポート)
#   - DIRECT_URL:   直接接続 (5432番ポート、pg_dump 用)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '本番DBへの実行を確認するため "migrate-production" と入力してください'
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    # DATABASE_URL は通常トランザクションモードのプーラー(6543)を指すが、
    # Prisma migrate CLI がこのランナーからそのプーラーに対して
    # ハングすることが判明している（migrate-to-ledgers.yml で確認済み）。
    # このワンショットジョブでは DATABASE_URL もセッションプーラー
    # (DIRECT_URL と同じ)にして、すべてのステップで到達可能な接続を使う。
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ inputs.confirm }}" != "migrate-production" ]; then
            echo "confirm 入力が一致しません。実行を中止します。" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ensure pg_dump is available
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version

      - name: Diagnose DB connectivity
        run: |
          echo "--- DATABASE_URL (expected port 5432) ---"
          timeout 15 pg_isready -d "$DATABASE_URL" || echo "DATABASE_URL: pg_isready failed or timed out (exit $?)"
          echo "--- DIRECT_URL (expected port 5432) ---"
          timeout 15 pg_isready -d "$DIRECT_URL" || echo "DIRECT_URL: pg_isready failed or timed out (exit $?)"

      - name: Check migration status (pre)
        run: timeout 60 npx prisma migrate status || echo "::warning::migrate status (pre) failed or timed out (exit $?)"

      - name: Backup production database
        id: backup
        run: |
          filename="backup_$(date -u +%Y%m%d_%H%M%S).dump"
          timeout 120 pg_dump "$DIRECT_URL" -Fc -f "$filename"
          ls -lh "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ steps.backup.outputs.filename }}
          retention-days: 14

      - name: Apply pending migrations
        run: timeout 120 npx prisma migrate deploy

      - name: Run notes/share-link migration script
        run: timeout 120 npx tsx prisma/migrations/migrate-ledger-share-and-notes.ts

      - name: Check migration status (post)
        run: timeout 60 npx prisma migrate status

      - name: Write job summary
        run: |
          {
            echo "## Notes / share link migration summary"
            echo ""
            echo "- Backup file: \`${{ steps.backup.outputs.filename }}\` (see workflow artifacts, retained 14 days)"
            echo ""
            echo "### Row counts"
            echo '```'
            npx tsx -e "
              import { PrismaClient } from './src/generated/prisma/client';
              import { PrismaPg } from '@prisma/adapter-pg';
              const adapter = new PrismaPg({ connectionString: process.env.DATABASE_URL });
              const prisma = new PrismaClient({ adapter });
              (async () => {
                const [ledgerNotes, ledgersWithShareToken, transactions] = await Promise.all([
                  prisma.ledgerNote.count(),
                  prisma.ledger.count({ where: { shareToken: { not: null } } }),
                  prisma.transaction.count(),
                ]);
                console.log('LedgerNote:', ledgerNotes);
                console.log('Ledger with shareToken:', ledgersWithShareToken);
                console.log('Transaction:', transactions);
              })().finally(() => prisma.\$disconnect());
            "
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
