name: Deploy to Cloudflare Workers

# main への push で本番（Cloudflare Workers）にデプロイする。詳細は docs/11-cloudflare-workers.md。
# Worker の実行時シークレット（JWT_SECRET / CF_ACCESS_* など）は
# Cloudflare 側（wrangler secret put / ダッシュボード）に置いてあり、ここでは扱わない。
on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイ同士が並行しないように順番に実行する
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      # 未適用の D1 マイグレーション（drizzle/）があれば、新しいコードより先に本番 DB に当てる。
      # 適用済みのものは d1_migrations テーブルで管理されていて、二重には流れない
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tukekan-db --remote

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
