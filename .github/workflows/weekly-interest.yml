name: Weekly Interest Job

on:
  schedule:
    # 毎週水曜 09:00 JST (00:00 UTC)
    - cron: "0 0 * * 3"
  workflow_dispatch:

jobs:
  apply-interest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run weekly interest job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/weekly-interest.ts
