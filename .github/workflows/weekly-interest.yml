name: Weekly Interest Job

on:
  schedule:
    # 毎日 09:00 JST (00:00 UTC)。
    # どの口座の利息を発生させるかは、口座ごとの発生曜日（Ledger.interestAccrualWeekday）を
    # スクリプト側で判定する。各口座につき利息が発生するのは週1回。
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  apply-interest:
    runs-on: ubuntu-latest
    # postinstall の `prisma generate` が prisma.config.ts 経由で DATABASE_URL を要求するため、
    # 実行ステップだけでなくジョブ全体に渡す（ステップ単位だと `npm ci` が失敗する）。
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run weekly interest job
        run: npx tsx scripts/weekly-interest.ts
