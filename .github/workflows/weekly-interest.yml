name: Weekly Interest Job

on:
  schedule:
    # 毎日 00:10 JST (15:10 UTC)。日付が変わった直後の残高に対して利息を計算する。
    # 毎時0分ちょうどは GitHub Actions の cron が混み合って遅延しやすいため数分ずらしている。
    # スケジュール実行は遅れる方向にしかブレないので、多少遅延してもJSTの日付は変わらない。
    # どの口座の利息を発生させるかは、口座ごとの発生曜日（Ledger.interestAccrualWeekday）を
    # スクリプト側で判定する。各口座につき利息が発生するのは週1回。
    - cron: "10 15 * * *"
  workflow_dispatch:

jobs:
  apply-interest:
    runs-on: ubuntu-latest
    # postinstall の `prisma generate` が prisma.config.ts 経由で DATABASE_URL を要求するため、
    # 実行ステップだけでなくジョブ全体に渡す（ステップ単位だと `npm ci` が失敗する）。
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run weekly interest job
        run: npx tsx scripts/weekly-interest.ts
